name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia qtsvg'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package-macos.sh --qt "$QT_ROOT_DIR" --jobs 4
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -QtRoot "$env:QT_ROOT_DIR" -Jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: qDing-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
